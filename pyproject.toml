[project]
name = "ha-autoterm-usb"
version = "0.1.0"
description = "Home Assistant custom integration for Autoterm / Planar diesel air heaters via USB serial."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "pyserial-asyncio-fast>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "voluptuous>=0.15",
  "homeassistant>=2024.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["manual-test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "N"]
ignore = [
  "PLR0913",  # too many args (HA config flows have wide signatures)
  "PLR2004",  # magic-value comparisons
  "PLR0911",  # too many returns
]

[tool.ruff.lint.per-file-ignores]
"custom_components/autoterm/tests/*" = ["S101", "PLR2004", "N802", "PLC0415", "E501"]
"custom_components/autoterm/config_flow.py" = ["PLC0415"]
"custom_components/autoterm/client.py" = ["N818"]
"custom_components/autoterm/diagnostics.py" = ["PLC0415"]
"conftest.py" = ["E402", "N816", "N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["custom_components/autoterm/tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
